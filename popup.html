<!DOCTYPE html>
<html>
<head>
  <title>TheFork Restaurant Scraper</title>
  <style>
    body {
      width: 600px;
      padding: 10px;
      font-family: Arial, sans-serif;
    }
    
    h1 {
      font-size: 18px;
      margin-bottom: 15px;
    }
    
    #restaurant-list {
      height: 400px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 15px;
    }
    
    .restaurant-item {
      padding: 10px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      position: relative;
    }
    
    .restaurant-item:hover {
      background-color: #f8f8f8;
    }
    
    .restaurant-item:last-child {
      border-bottom: none;
    }
    
    .restaurant-name {
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    .restaurant-link {
      color: #0078d7;
      text-decoration: none;
      display: block;
      margin-top: 3px;
      font-size: 12px;
      word-break: break-all;
    }
    
    .restaurant-details {
      display: none;
      margin-top: 10px;
      padding: 10px;
      background-color: #f5f5f5;
      border-radius: 4px;
      font-size: 13px;
    }
    
    .restaurant-details.active {
      display: block;
    }
    
    .detail-label {
      font-weight: bold;
      display: inline-block;
      width: 100px;
      margin-bottom: 5px;
    }
    
    .fetch-details-btn {
      position: absolute;
      right: 10px;
      top: 10px;
      background-color: #0078d7;
      color: white;
      border: none;
      padding: 3px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
    }
    
    .fetch-details-btn:hover {
      background-color: #005a9e;
    }
    
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0, 0, 0, 0.1);
      border-left-color: #0078d7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 5px;
      vertical-align: middle;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .status-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }
    
    .status-pending {
      background-color: #ffc107;
    }
    
    .status-success {
      background-color: #28a745;
    }
    
    .status-error {
      background-color: #dc3545;
    }
    
    .button-container {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }
    
    #export-btn, #fetch-all-btn {
      background-color: #0078d7;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 4px;
      cursor: pointer;
    }
    
    #export-btn:hover, #fetch-all-btn:hover {
      background-color: #005a9e;
    }
    
    #progress-bar-container {
      height: 20px;
      background-color: #f0f0f0;
      border-radius: 4px;
      margin-bottom: 15px;
      display: none;
    }
    
    #progress-bar {
      height: 100%;
      background-color: #0078d7;
      border-radius: 4px;
      width: 0%;
      transition: width 0.3s;
    }
    
    #status {
      margin-top: 10px;
      color: #666;
    }
    
    .error {
      color: #dc3545;
    }
    
    .success {
      color: #28a745;
    }
  </style>
</head>
<body>
  <h1>TheFork Restaurant Scraper</h1>
  
  <div class="button-container">
    <button id="fetch-all-btn">Fetch All Details</button>
    <button id="export-btn">Export (CSV)</button>
  </div>
  
  <div id="progress-bar-container">
    <div id="progress-bar"></div>
  </div>
  
  <div id="restaurant-list">
    <p>Loading restaurants...</p>
  </div>
  
  <div id="status"></div>
  
  <script src="popup.js"></script>
</body>
</html>
